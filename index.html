    function renderMenu(){
      const grid=document.getElementById("menu-grid"), empty=document.getElementById("empty-search"), note=document.getElementById("category-note");
      let items=query?categories.flatMap(c=>c[2].map((r,i)=>itemObject(c,r,i))).filter(i=>(i.name+" "+i.description+" "+categoryData(i.category)[1]).toLowerCase().includes(query.toLowerCase())):categoryData(activeCategory)[2].map((r,i)=>itemObject(categoryData(activeCategory),r,i));
      document.getElementById("category-name").textContent=query?"Resultados da busca":categoryData(activeCategory)[1];
      document.getElementById("result-count").textContent=items.length+(items.length===1?" item":" itens");
      note.textContent=!query&&notes[activeCategory]?"💡 "+notes[activeCategory]:"";note.classList.toggle("hidden",!note.textContent);
      grid.innerHTML=""; empty.classList.toggle("hidden",items.length>0);
      items.forEach(item=>{const frag=document.getElementById("menu-card-template").content.cloneNode(true), card=frag.querySelector("article");card.querySelector("[data-template-id='menu-item-name']").textContent=item.name;card.querySelector(".item-price").textContent=item.price?money(item.price):"Consulte";card.querySelector(".item-description").textContent=item.description||"Preparado com o cuidado da nossa cozinha.";if(item.includesDrink)card.querySelector(".drink-tag").classList.remove("hidden");const add=card.querySelector(".add-item");add.querySelector(".button-label").textContent=["grelhados","massas"].includes(item.category)?"Personalizar":"Adicionar";add.onclick=()=>["grelhados","massas"].includes(item.category)?openCustomizer(item):addToCart(item);grid.appendChild(frag)});lucide.createIcons();
    }
    function addToCart(item,custom={}){const key=item.id+JSON.stringify(custom);let found=cart.find(x=>x.key===key);if(found)found.quantity++;else cart.push({key,item,custom,quantity:1});document.getElementById("customizer-overlay").classList.add("hidden");document.getElementById("customizer-overlay").classList.remove("flex");renderCart()}
    function openCustomizer(item){customItem=item;chosenGarnishes=[];chosenSauce="";chosenPasta="Espaguete";chosenPastaSauce="Bolognese";document.getElementById("customizer-name").textContent=item.name;renderCustomizer();const o=document.getElementById("customizer-overlay");o.classList.remove("hidden");o.classList.add("flex")}
    function renderCustomizer(){const h=document.getElementById("customizer-options");h.innerHTML="";if(customItem.category==="grelhados"){h.innerHTML='<h3 class="mb-3 font-bold text-white">Guarnições <span class="text-sm font-normal text-slate-400">(até 3)</span></h3><div id="garnishes" class="grid grid-cols-2 gap-2"></div><h3 class="mb-3 mt-6 font-bold text-white">Molho</h3><div id="sauces" class="grid grid-cols-2 gap-2"></div>';garnishes.forEach(x=>choice("garnishes",x,chosenGarnishes.includes(x),()=>{chosenGarnishes=chosenGarnishes.includes(x)?chosenGarnishes.filter(v=>v!==x):(chosenGarnishes.length<3?[...chosenGarnishes,x]:chosenGarnishes);renderCustomizer()});sauces.forEach(x=>choice("sauces",x,chosenSauce===x,()=>{chosenSauce=x;renderCustomizer()}))}else{h.innerHTML='<h3 class="mb-3 font-bold text-white">Tipo de massa</h3><div id="pasta" class="grid grid-cols-3 gap-2"></div><h3 class="mb-3 mt-6 font-bold text-white">Molho artesanal</h3><div id="pasta-sauce" class="grid gap-2"></div>';["Espaguete","Penne","Talharim"].forEach(x=>choice("pasta",x,chosenPasta===x,()=>{chosenPasta=x;renderCustomizer()}));pastaSauces.forEach(x=>choice("pasta-sauce",x,chosenPastaSauce===x,()=>{chosenPastaSauce=x;renderCustomizer()}))}}
    function choice(parent,label,selected,fn){const b=document.createElement("button");b.type="button";b.textContent=(selected?"✓ ":"")+label;b.className="choice rounded-xl border border-slate-700 bg-slate-800 p-3 text-left text-sm font-semibold text-slate-300 "+(selected?"selected":"");b.onclick=fn;document.getElementById(parent).appendChild(b)}
    function renderCart(){const list=document.getElementById("cart-items"),empty=document.getElementById("empty-cart"),summary=document.getElementById("cart-summary"),count=document.getElementById("cart-count");list.innerHTML="";const quantity=cart.reduce((s,x)=>s+x.quantity,0);count.textContent=quantity;empty.classList.toggle("hidden",cart.length>0);summary.classList.toggle("hidden",cart.length===0);cart.forEach(line=>{const d=document.createElement("div"),custom=line.custom.guarnicoes?.length?line.custom.guarnicoes.join(", ")+" · "+line.custom.molho:line.custom.massa?line.custom.massa+" · "+line.custom.molhoMassa:"";d.className="rounded-2xl border border-slate-800 bg-slate-900 p-4";d.innerHTML=`<div class="flex gap-3"><div class="flex-1"><h3 class="font-bold text-white">${line.item.name}</h3>${custom?`<p class="mt-1 text-xs text-amber-200">${custom}</p>`:""}<p class="mt-2 text-sm text-slate-400">${line.item.price?money(line.item.price):"Valor sob consulta"}</p></div><strong class="text-amber-300">${line.item.price?money(line.item.price*line.quantity):"—"}</strong></div><div class="mt-3 flex items-center justify-end gap-3"><button class="minus rounded-lg bg-slate-800 px-3 py-1 font-bold" type="button">−</button><span class="font-bold">${line.quantity}</span><button class="plus rounded-lg bg-slate-800 px-3 py-1 font-bold" type="button">+</button></div>`;d.querySelector(".minus").onclick=()=>{line.quantity--;if(!line.quantity)cart=cart.filter(x=>x!==line);renderCart()};d.querySelector(".plus").onclick=()=>{line.quantity++;renderCart()};list.appendChild(d)});const subtotal=cart.reduce((s,x)=>s+x.item.price*x.quantity,0),service=subtotal*.1;document.getElementById("subtotal").textContent=money(subtotal);document.getElementById("service-charge").textContent=money(service);document.getElementById("total").textContent=money(subtotal+service)}
    const handler={onDataChanged(data){records=data}};
    async function confirmOrder(){const btn=document.getElementById("confirm-order"),status=document.getElementById("order-status"),subtotal=cart.reduce((s,x)=>s+x.item.price*x.quantity,0),service=subtotal*.1;if(!cart.length)return;btn.disabled=true;btn.textContent="Salvando pedido…";const result=await window.dataSdk.create({order_id:"LAG-"+Date.now().toString().slice(-7),items:cart.map(x=>`${x.quantity}x ${x.item.name}`).join(" | "),subtotal,service_charge:service,total:subtotal+service,created_at:new Date().toISOString()});status.classList.remove("hidden");if(result.isOk){status.className="mt-3 rounded-lg bg-emerald-400/10 p-3 text-sm text-emerald-200";status.textContent="Pedido confirmado e enviado para a Canva Sheet.";cart=[];renderCart()}else{status.className="mt-3 rounded-lg bg-red-400/10 p-3 text-sm text-red-200";status.textContent="Não foi possível salvar o pedido. Tente novamente."}btn.disabled=false;btn.textContent="Confirmar pedido"}
    document.getElementById("menu-search").addEventListener("input",e=>{query=e.target.value.trim();renderMenu()});
    document.getElementById("open-cart").onclick=()=>document.getElementById("cart-panel").classList.remove("hidden");
    document.getElementById("close-cart").onclick=()=>document.getElementById("cart-panel").classList.add("hidden");
    document.getElementById("close-customizer").onclick=document.getElementById("cancel-customization").onclick=()=>{document.getElementById("customizer-overlay").classList.add("hidden");document.getElementById("customizer-overlay").classList.remove("flex")};
    document.getElementById("apply-customization").onclick=()=>addToCart(customItem,customItem.category==="grelhados"?{guarnicoes:chosenGarnishes,molho:chosenSauce}:{massa:chosenPasta,molhoMassa:chosenPastaSauce});
    document.getElementById("confirm-order").onclick=confirmOrder;
    (async()=>{const r=await window.dataSdk.init(handler);if(!r.isOk){document.getElementById("order-status").textContent="Os pedidos não estão disponíveis no momento.";}})();
    renderTabs();renderMenu();renderCart();lucide.createIcons();
  </script>
 </body>
</html>
