<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1118" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Cardápio digital interativo do Laguna Plaza Hotel & Restaurante Mandi. Faça seus pedidos de forma rápida e prática." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <title>Cardápio · Laguna Plaza Hotel & Restaurante Mandi</title>
    
    <!-- Ícones e Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Otimização de Carregamento de Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Estilo Inline crítico para evitar flash branco antes do carregamento do Tailwind -->
    <style>
      body {
        background-color: #0b1118;
        color: #f8fafc;
        margin: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #root:empty {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #0b1118;
      }
    </style>
  </head>
  <body class="bg-[#0b1118] text-slate-100 antialiased selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
